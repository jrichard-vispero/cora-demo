name: Accessibility

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: accessibility-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  accessibility:
    name: Accessibility scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # uploading SARIF
    env:
      CORA_TOKEN: ${{ secrets.CORA_TOKEN }} # empty in a run that gets no secrets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build with source stamps
        run: npm run build
        env:
          CORA_SOURCE_STAMPS: 1 # stamp source locations, with @vispero/cora/vite registered

      # cora.config.ts points at the dev server for local work; here cora serves the build.
      - name: Scan
        if: env.CORA_TOKEN != ''
        run: npx cora scan
        env:
          CORA_BASE_URL: http://localhost:4173
          CORA_SERVER_COMMAND: npm run preview
          CORA_SERVER_URL: http://localhost:4173

      - name: Skip the scan without a token
        if: env.CORA_TOKEN == ''
        run: echo "::notice::No CORA_TOKEN reached this run, so the accessibility scan was skipped."

      - name: Upload results to code scanning
        if: ${{ !cancelled() && env.CORA_TOKEN != '' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: .cora/report/results.sarif
          category: accessibility

      - name: Upload the accessibility report
        if: ${{ !cancelled() && env.CORA_TOKEN != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: accessibility-report
          path: .cora/report/
          include-hidden-files: true # .cora/ is hidden, which the upload skips by default
          retention-days: 14
